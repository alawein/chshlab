name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          # chshlab is a private repo without GitHub Advanced Security, so the
          # code-scanning SARIF upload endpoint is unavailable. Run the analysis
          # as a CI gate (queries still fail the job on real errors) but skip the
          # upload that would otherwise fail with "Code scanning is not enabled".
          upload: never
