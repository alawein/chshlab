<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — CHSH Lab</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230E0F14'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='%23C9A94D'%3ES%3C/text%3E%3Cline x1='4' y1='27' x2='28' y2='27' stroke='%23C9A94D' stroke-width='1.5' opacity='0.4'/%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garant:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0E0F14;
      color: #EAE6DA;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .code {
      font-family: 'Cormorant Garant', Georgia, serif;
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 300;
      color: #C9A94D;
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0.7;
    }
    .title {
      font-family: 'Cormorant Garant', Georgia, serif;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 400;
      margin-bottom: 24px;
      line-height: 1.3;
    }
    .message {
      font-size: 13px;
      color: #9A9485;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A94D, transparent);
      margin: 0 auto 24px;
      opacity: 0.4;
    }
    .link {
      font-size: 12px;
      letter-spacing: 0.06em;
      padding: 10px 24px;
      border: 1px solid rgba(255,255,255,0.08);
      color: #9A9485;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
      display: inline-block;
    }
    .link:hover {
      color: #C9A94D;
      border-color: rgba(201,169,77,0.3);
    }
    .equation {
      font-size: 11px;
      color: #5C5A55;
      margin-top: 40px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1 class="title">This page wasn't detected.</h1>
    <div class="divider"></div>
    <p class="message">
      Much like a particle pair lost to the detection loophole,
      the page you're looking for didn't make it through.
    </p>
    <a href="/" class="link">Return to the experiment</a>
    <p class="equation">P(detection) = 0 for this URL</p>
  </div>
</body>
</html>
